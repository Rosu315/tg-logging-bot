[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-logging-bot"
version = "0.1.0"
description = "Telegram Business bot that keeps the traces of deleted, edited and view-once messages, with a web backup viewer. Fork of Vestige (manch1915/vestige-bot)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "manch1915" }, { name = "Rosu315" }]
keywords = ["telegram", "bot", "aiogram", "telegram-business", "business-connection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiogram>=3.22,<4",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
tg-logging-bot = "tg_logging_bot.__main__:run"

[project.urls]
Homepage = "https://github.com/Rosu315/tg-logging-bot"
Issues = "https://github.com/Rosu315/tg-logging-bot/issues"
Changelog = "https://github.com/Rosu315/tg-logging-bot/blob/main/CHANGELOG.md"
Upstream = "https://github.com/manch1915/vestige-bot"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_logging_bot"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "BLE"]
ignore = [
    "B008",
    # Cyrillic user-facing strings are intentional.
    "RUF001",
    "RUF002",
    "RUF003",
    # Small local filesystem calls (mkdir/exists/unlink) inside async helpers;
    # anything that can actually block for long is wrapped in asyncio.to_thread.
    "ASYNC240",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
packages = ["tg_logging_bot"]
mypy_path = "src"
ignore_missing_imports = true
